[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "instadeals"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "python-telegram-bot>=22,<23", "python-dotenv>=1,<2", "jsonschema>=4,<5", "cryptography>=44", "aiohttp>=3.11,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
instadeals = "instadeals.app:main"

[tool.setuptools.packages.find]
include = ["instadeals*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
